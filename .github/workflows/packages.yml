name: Desktop test packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Rust target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version
          uname -m
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path crates/journal-core/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build desktop bundles
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect Linux packages
        if: runner.os == 'Linux'
        run: |
          mkdir release-artifacts
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb release-artifacts/
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage release-artifacts/
          file src-tauri/target/${{ matrix.target }}/release/scripture-journal > release-artifacts/executable-architecture.txt
          grep -q 'x86-64' release-artifacts/executable-architecture.txt
      - name: Collect Apple Silicon packages
        if: runner.os == 'macOS'
        run: |
          mkdir release-artifacts
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg release-artifacts/
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Scripture Journal.app" release-artifacts/Scripture-Journal-macos-arm64.app.zip
          file "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Scripture Journal.app/Contents/MacOS/scripture-journal" > release-artifacts/executable-architecture.txt
          grep -q 'arm64' release-artifacts/executable-architecture.txt
      - name: Record artifact checksums
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python3 scripts/package_manifest.py release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: scripture-journal-${{ matrix.target }}-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
